<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">博客系统全链路修复记录</title>
  <desc id="desc">从安全审计到线上发布的四个关键步骤</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#e7eef4"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102449"/>
      <stop offset="1" stop-color="#1b427c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#18345b" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 140H1600M0 280H1600M0 420H1600M0 560H1600M0 700H1600" stroke="#d8cbbd" stroke-opacity=".28"/>
  <path d="M180 0V900M420 0V900M660 0V900M900 0V900M1140 0V900M1380 0V900" stroke="#d8cbbd" stroke-opacity=".22"/>

  <text x="104" y="112" fill="#c26335" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" letter-spacing="5">ENGINEERING NOTES · 2026.08</text>
  <text x="104" y="202" fill="#14243e" font-family="Arial, 'PingFang SC', sans-serif" font-size="76" font-weight="800">博客系统全链路修复记录</text>
  <text x="108" y="260" fill="#61708a" font-family="Arial, 'PingFang SC', sans-serif" font-size="30">从权限边界、内容安全到线上发布的四个关键步骤</text>

  <g transform="translate(104 350)" filter="url(#shadow)">
    <rect width="1392" height="348" rx="28" fill="#fffaf2" stroke="#e2cdb7" stroke-width="2"/>
    <path d="M120 108H1272" stroke="#d07843" stroke-width="4" stroke-linecap="round"/>
    <g font-family="Arial, 'PingFang SC', sans-serif">
      <g transform="translate(120 108)">
        <circle r="18" fill="#d07843"/>
        <circle r="8" fill="#fffaf2"/>
        <text x="-12" y="-52" fill="#d07843" font-size="22" font-weight="700">01</text>
        <text x="-12" y="72" fill="#14243e" font-size="30" font-weight="700">审计</text>
        <text x="-12" y="112" fill="#61708a" font-size="22">权限 · 隐私 · XSS</text>
      </g>
      <g transform="translate(500 108)">
        <circle r="18" fill="#d07843"/>
        <circle r="8" fill="#fffaf2"/>
        <text x="-12" y="-52" fill="#d07843" font-size="22" font-weight="700">02</text>
        <text x="-12" y="72" fill="#14243e" font-size="30" font-weight="700">修复</text>
        <text x="-12" y="112" fill="#61708a" font-size="22">Cookie 会话 · 上传校验</text>
      </g>
      <g transform="translate(880 108)">
        <circle r="18" fill="#d07843"/>
        <circle r="8" fill="#fffaf2"/>
        <text x="-12" y="-52" fill="#d07843" font-size="22" font-weight="700">03</text>
        <text x="-12" y="72" fill="#14243e" font-size="30" font-weight="700">验证</text>
        <text x="-12" y="112" fill="#61708a" font-size="22">回归测试 · 构建 · 冒烟</text>
      </g>
      <g transform="translate(1272 108)">
        <circle r="18" fill="#1e8a80"/>
        <circle r="8" fill="#fffaf2"/>
        <text x="-12" y="-52" fill="#1e8a80" font-size="22" font-weight="700">04</text>
        <text x="-12" y="72" fill="#14243e" font-size="30" font-weight="700">上线</text>
        <text x="-12" y="112" fill="#61708a" font-size="22">低权限运行 · 可回滚</text>
      </g>
    </g>
    <g transform="translate(72 238)" font-family="Arial, 'PingFang SC', sans-serif">
      <rect width="1248" height="70" rx="14" fill="#eef3fb"/>
      <text x="28" y="45" fill="#244d88" font-size="24" font-weight="700">核心原则</text>
      <text x="190" y="45" fill="#61708a" font-size="22">最小权限 · 公开数据脱敏 · 令牌不落地 · 每次发布可验证</text>
    </g>
  </g>

  <text x="104" y="790" fill="#14243e" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">LiXD Studio / Blog Engineering</text>
  <text x="1496" y="790" text-anchor="end" fill="#8a7a6d" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">敏感凭据不入代码、不入文章</text>
</svg>
